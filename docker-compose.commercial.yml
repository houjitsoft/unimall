# UniMall commercial services: use only the profile for the purchased product.
# Images must define their own application HEALTHCHECK; a TCP port alone is not readiness.
# Source archives are delivered separately and are never mounted into these containers.
services:
  crm:
    profiles: ["crm"]
    image: ${UNIMALL_CRM_IMAGE:-unimall-crm:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-crm
    restart: unless-stopped
    networks: [unimall]
    environment:
      SERVER_PORT: "8311"
      SPRING_APPLICATION_NAME: crm
      NACOS_ADDR: ${NACOS_ADDR:?Set NACOS_ADDR}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-houeoc}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Set NACOS_PASSWORD}
      TZ: Asia/Shanghai
  cms:
    profiles: ["cms"]
    image: ${UNIMALL_CMS_IMAGE:-unimall-cms:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-cms
    restart: unless-stopped
    networks: [unimall]
    environment:
      SERVER_PORT: "8217"
      SPRING_APPLICATION_NAME: cms

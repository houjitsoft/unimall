  bff-web:
    <<: *java-service
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-bff-web
    # 合并共享环境变量与 bff-web 独有的必填项（YAML 合并键不会深合并，
    # 直接写 environment 会把锚点里的 NACOS_* 全部覆盖掉，必须显式合并两段）
    environment:
      <<: [*java-service-env, *bff-env]
      # 上传目录必须指向容器内真实存在的路径：bootstrap.yml 的默认值曾是
      # X99 时代的 D:/wwwroot/houcloud/public/uploads/mall（Windows 路径），Linux 容器里
      # 一定不存在，导致 /web/common/file/{name} 一律 404（2026-09-20 财务中心图片全挂）。
      LOCAL_UPLOAD_PATH: /www/wwwroot/houcloud_code/uploads
    mem_limit: ${BFF_MEM_LIMIT:-1200m}
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-unimall/builder:latest}
        JAR_NAME: bff-web
    image: unimall/bff-web:${IMAGE_TAG:-latest}
    ports:
      - "${BFF_PORT:-8391}:8391"
    # 上传文件目录：必须挂到宿主机持久目录。
    # /web/common/file/{fileName}（WebCommonController#serveFile）与本地上传
    # （LocalFileUploadService）都读写 local.upload.path，未配置时默认
    # /www/wwwroot/houcloud_code/uploads —— 容器内该路径是空的，于是页面上所有
    # <img src="/web/common/file/xxx.jpg"> 一律 404，且新上传的文件随容器销毁丢失。
    volumes:
      - ./public/uploads/mall:/www/wwwroot/houcloud_code/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/8391' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 150s

  # ------------------------------------------------------------ 前端
  admin-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        APP_DIR: frontend/admin
        # 🔴 必须为空：admin 的 API 封装路径自带 /web 前缀（request.js baseURL = VITE_APP_BASE_API）。
        # 这里注入 /web 会让请求变成 /web/web/auth/login 双前缀，BFF 返回 20001「请求的资源不存在」
        # ——2026-10-28 浏览器首登失败的实锤根因（compose build args 覆盖了 Dockerfile 的空默认值）。
        VITE_APP_BASE_API: ""
    image: ${ADMIN_WEB_IMAGE:-unimall/admin-web:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-admin-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      bff-web:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------ 安装向导（install profile）
  # 只在安装期存在：install.sh --wizard 拉起；安装完成由 agent 的 finish 接口停掉，
  # WEB_PORT 交还 admin-web。正常 compose up 不会启动它们（profile 隔离）。
  install-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.install-agent
    image: ${INSTALL_AGENT_IMAGE:-unimall/install-agent:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-install-agent
    profiles: ["install"]
    # 🔴 同构挂载（2026-10-28 第五轮两连坑后的终解）：
    # agent 要在容器里跑 docker compose，而 compose 有一类双重身份的路径：
    #   挂载源/build context 由 dockerd 在宿主侧解析；而 compose client 自己
    #   又要读同一批路径（build context 打包、.env、相对挂载展开）。
    # 挂 /project 时宿主侧被 Docker 自动建空目录（mysql 挂空 initdb、broker 读空
    # conf 直接 crash-loop）；改 --project-directory 传宿主路径时 compose client
    # 在容器内又 lstat 不到。唯一两全：把仓库目录**原路径**（宿主绝对路径）挂进
    # 容器同名位置，两端看到同一个路径。HOUCLOUD_HOST_PROJECT_DIR 由
    # install.sh --wizard 在宿主机 export 注入；未注入时退化为 ./ 挂 /project
    #（非向导场景没人用 agent，仅保 compose 可解析）。
    working_dir: ${HOUCLOUD_HOST_PROJECT_DIR:-/project}
    volumes:
      - ${HOUCLOUD_HOST_PROJECT_DIR:-./}:${HOUCLOUD_HOST_PROJECT_DIR:-/project}
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # custom 模式连通测试/灌库要连「宿主机上的中间件」：
      # 用户填 127.0.0.1 时 agent 改走 host.docker.internal（app.py 的 rewrite_loopback）
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      INSTALL_PROJECT_DIR: ${HOUCLOUD_HOST_PROJECT_DIR:-/project}
      HOUCLOUD_HOST_PROJECT_DIR: ${HOUCLOUD_HOST_PROJECT_DIR:-}
    restart: unless-stopped

  install-web:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-install-web
    profiles: ["install"]
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./deploy/nginx/install-wizard.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - install-agent
    restart: unless-stopped

  # ------------------------------------------------------------ 可选组件
  elasticsearch:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-es
    profiles: ["es"]
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ES_PASSWORD:-change-me}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      TZ: Asia/Shanghai
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

# 注：这里刻意**不声明** networks —— 所有服务自然落入 compose 的 default 网络，
# 服务名互通能力不变（模式 A），同时 `network_mode: host` 不再与之互斥（模式 B）。
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-data:
  es-data:
  plugin-data:
  nacos-init-data:

# =====================================================================
# HouCloud · Docker 一键编排（部署轨 B：全容器化）
#
# 一条命令起整套系统：
#   cp .env.docker.example .env
#   bash deploy/scripts/docker.sh up          # = docker compose build + up -d
#
# 包含：MySQL / Redis / Nacos / RocketMQ + 14 个核心微服务 + 管理后台前端（Nginx）
#       + 10 个商业服务（commerce profile，源码同在 backend/paas/，默认不启，
#         `bash deploy/scripts/docker.sh full` 一条命令起完整 24 业务服务）
# 数据库初始化（670 张 Core 表 + 菜单/角色/admin）与 Nacos 配置导入都是自动的：
#   - MySQL 首启执行 deploy/mysql-init/00-init.sql（source 进 deploy/scripts/sql/init）
#   - nacos-init 一次性任务容器渲染变量表并导入 39 个 dataId
#
# 只想用容器跑中间件、服务仍用 jar 跑在宿主机？用 docker-compose.middleware.yml。
# 中间件已在宿主机（外部 Nacos / MySQL / Redis），只让业务服务进容器？叠加
# docker-compose.hostnet.yml 走 host 网络（详见 public/docs/docker/操作手册.md）。
# 资源建议：核心集 16GB 内存（14 个 JVM + 5 个中间件）；完整 24 服务再 +12GB；
# 8GB 机器用 bash deploy/scripts/docker.sh demo（最小集）。
#
# 两种模式：
#   A 全栈（默认）  docker compose up -d
#                  中间件与业务同进 bridge 网络，按服务名互通（nacos:8848）
#   B 外部中间件    docker compose -f docker-compose.yml -f docker-compose.hostnet.yml \
#                       up -d --no-deps <svc>
#                  host 网络直连宿主机端口；必须带 --no-deps，否则会去拉中间件抢端口
# =====================================================================

# 项目名可覆盖：同一台机器上跑第二套（预发/验收/客户演示）时，在 .env 里改
# COMPOSE_PROJECT_NAME 即可共存。原先写死 unimall，导致「已有一套的机器装不了第二套」，
# 容器名与数据卷名会直接撞车。
name: ${COMPOSE_PROJECT_NAME:-unimall}

x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    builder:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy
    # 2026-10-27：Redis 恢复为 compose 服务，作为硬依赖等它会话可用再起业务
    # （模式 B 用 --no-deps 起服务时不会拉起它，由外部中间件顶替）
    redis:
      condition: service_healthy
    rocketmq-broker:
      condition: service_started
    nacos-init:
      condition: service_completed_successfully
  environment: &java-service-env
    # 默认 nacos:8848 = 模式 A（容器内 Nacos）；模式 B（外部 Nacos）在 .env 里覆盖，
    # 例如 NACOS_ADDR=127.0.0.1:8848 或 NACOS_ADDR=127.0.0.1:8848
    NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
    NACOS_NAMESPACE: ${NACOS_NAMESPACE:-houeoc}
    NACOS_USER: ${NACOS_USER:-nacos}
    # 口令同时接受两个变量名：优先 NACOS_PASSWORD，回退 NACOS_AUTH_PASSWORD，都没有才用 nacos。
    # （Bootstrap 里读的环境变量叫 NACOS_PASSWORD，早期编排却只从 NACOS_AUTH_PASSWORD 取值，
    #   导致按常理写 NACOS_PASSWORD=xxx 的人被静默退回默认口令 —— 见 public/docs/docker/操作手册.md 5.7）
    NACOS_PASSWORD: ${NACOS_PASSWORD:-${NACOS_AUTH_PASSWORD:-nacos}}
    # Redis 兜底 env：bootstrap.yml 的兜底段引用 ${REDIS_HOST}/${REDIS_PORT}/${REDIS_PASSWORD}，
    # Nacos redis.yaml 拉取正常时被远端真值覆盖；拉取失败时靠它避免启动即崩。
    # REDIS_ADDR（host:port）由 entrypoint-service.sh 拆成 REDIS_HOST/REDIS_PORT。
    REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx900m -Dfile.encoding=UTF-8}
    TZ: Asia/Shanghai
    # ---- 插件分发 / 市场交易（base 使用；其余服务忽略同名变量）----
    # 这几项在 application-plugin.yml 里全是 ${ENV:} fail-closed 占位符：留空即拒绝，
    # 不会静默放行。空白机必须由 deploy/install.sh 生成后经这里注入，否则
    # 「发布 → 购买 → 下载 → 安装」整条链路会在五个不同接口上分别报错。
    HOU_ARTIFACT_DOWNLOAD_TOKEN_SECRET: ${HOU_ARTIFACT_DOWNLOAD_TOKEN_SECRET:-}
    HOU_ARTIFACT_SIGN_ACTIVE_KID: ${HOU_ARTIFACT_SIGN_ACTIVE_KID:-k2026}
    HOU_ARTIFACT_SIGN_PUBLIC_KEYS: ${HOU_ARTIFACT_SIGN_PUBLIC_KEYS:-}
    HOU_ARTIFACT_SIGN_PRIVATE_KEY_PATH: ${HOU_ARTIFACT_SIGN_PRIVATE_KEY_PATH:-}
    HOU_PLUGIN_REQUIRE_SIGNATURE: ${HOU_PLUGIN_REQUIRE_SIGNATURE:-true}
    HOU_PLUGIN_PAY_ENABLED: ${HOU_PLUGIN_PAY_ENABLED:-false}
    HOU_PLUGIN_PAY_CHANNEL: ${HOU_PLUGIN_PAY_CHANNEL:-CASHIER}
    HOU_PLUGIN_PAY_SANDBOX: ${HOU_PLUGIN_PAY_SANDBOX:-false}
    HOU_PLUGIN_PAY_ADMIN_TOKEN: ${HOU_PLUGIN_PAY_ADMIN_TOKEN:-}
    # HOU_*：供 application-plugin.yml 的 ${HOU_INTERNAL_JOB_TOKEN:} 占位；
    # HOUCLOUD_PLUGIN_*：Spring 松散绑定到 houcloud.plugin.internal-job-token（goods/order/userms/…）。
    # 留空 = fail-closed；install.sh 首次安装会写入 .env。
    HOU_INTERNAL_JOB_TOKEN: ${HOU_INTERNAL_JOB_TOKEN:-}
    HOUCLOUD_PLUGIN_INTERNAL_JOB_TOKEN: ${HOU_INTERNAL_JOB_TOKEN:-}
    # 跨宿主安装静态地址（base 读 houcloud.plugin.host-endpoints.*）。
    # install.sh 默认只起 permission/auth/userms/base/bff，故仅 userms/auth 给 Docker DNS 默认值，
    # 避免 goods/order 等未启动时被误判为「宿主已部署」。其它宿主按需在 .env 填写。
    HOU_PLUGIN_HOST_USERMS: ${HOU_PLUGIN_HOST_USERMS:-http://userms:8195}
    HOU_PLUGIN_HOST_AUTH: ${HOU_PLUGIN_HOST_AUTH:-http://auth:8392}
    HOU_PLUGIN_HOST_GOODS: ${HOU_PLUGIN_HOST_GOODS:-http://goods:8208}
    HOU_PLUGIN_HOST_ORDER: ${HOU_PLUGIN_HOST_ORDER:-http://order:8209}
    HOU_PLUGIN_HOST_CMS: ${HOU_PLUGIN_HOST_CMS:-}
    HOU_PLUGIN_HOST_TOOL: ${HOU_PLUGIN_HOST_TOOL:-}
    HOU_PLUGIN_HOST_PAYMENT: ${HOU_PLUGIN_HOST_PAYMENT:-http://payment:8207}
    HOU_PLUGIN_PAY_CASHIER_API_KEY: ${HOU_PLUGIN_PAY_CASHIER_API_KEY:-}
    HOU_BASE_PUBLIC_BASE_URL: ${HOU_BASE_PUBLIC_BASE_URL:-}
    # Seata 分布式事务。默认 true 保持既有生产行为（①有 seata-server）；
    # 空白机没有 seata-server，seata 客户端仍会去要 vgroupMapping 配置，
    # 直接 BeanCreationException 崩在 globalTransactionScanner。安装器生成的 .env 里设 false。
    SEATA_ENABLED: ${SEATA_ENABLED:-true}
  mem_limit: ${SERVICE_MEM_LIMIT:-1200m}

# bff-web 独有的两个必填环境变量。
# 它的 bootstrap.yml 里 xxl.job.admin.password / restart.admin.token 是无默认值的占位符
# （其余 13 个服务不需要），容器里不显式传入会直接启动失败：
#   Could not resolve placeholder 'XXL_JOB_PASS'
# 随机串即可，自行在 .env 中设置。
x-bff-env: &bff-env
  XXL_JOB_PASS: ${XXL_JOB_PASS:?XXL_JOB_PASS is required by bff-web}
  RESTART_ADMIN_TOKEN: ${RESTART_ADMIN_TOKEN:?RESTART_ADMIN_TOKEN is required by bff-web}

services:
  # ------------------------------------------------------------ 构建器
  # 一次性编译全部服务并归集 jar 到 /jars；各服务镜像只从它 COPY 自己那一个 jar。
  builder:
    build:
      context: .
      dockerfile: deploy/Dockerfile.builder
    image: ${BUILDER_IMAGE:-unimall/builder:latest}
    command: ["sh", "-c", "echo builder ready; ls -lh /jars"]
    restart: "no"

  # ------------------------------------------------------------ 中间件
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.39}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meoc}
      MYSQL_USER: ${MYSQL_USER:-meoc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
      - ./deploy/scripts/sql/init:/opt/houcloud-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ------------------------------------------------------------ Redis
  # 🔴 2026-10-27：Redis 恢复为 compose 服务。
  #   2026-10-19 曾因 RH2288 上容器 Redis 抢占宿主机 6379 而删除本服务，但那次只是
  #   「生产机已有宿主 Redis」的场景；删掉后全新机器上模式 A 根本没有 Redis，
  #   而 nacos-init 又把 REDIS_ADDR 渲成 127.0.0.1，容器内连不上 → 所有服务起不来。
  #
  #   现在的取法：
  #   - 默认（模式 A，全新机器）起本服务，服务名 redis，REDIS_ADDR 默认 redis:6379；
  #   - 宿主机已有 Redis（RH2288 生产机，模式 B）时用 -f docker-compose.hostnet.yml
  #     且 --no-deps，本服务不会被拉起；并在 .env 里设 REDIS_ADDR=127.0.0.1:6379。
  #   - 只想用外部 Redis 又非要走模式 A：设 REDIS_ADDR=<host>:6379 并给本服务加
  #     `profiles: ["bundled-redis"]` 按需启用（compose 里改，不建议长期这么挂着）。
  redis:
    image: ${REDIS_IMAGE:-redis:7.2-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-redis
    command:
      - sh
      - -c
      # 有密码就带密码启动，没密码就明文（模板里 password 是占位符，留空即无密码）
      - >-
        exec redis-server
        --appendonly yes
        --dir /data
        ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  nacos:
    image: ${NACOS_IMAGE:-nacos/nacos-server:v2.3.2}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-nacos
    # 🔴 2026-10-27 实测：Nacos 2.3.2 内嵌 Derby 首次建库有 30s 登录超时。装机时
    # MySQL 正在建 700+ 张表（重 I/O），Derby 建库偶发超时 → 登录失败 → nacos 启动
    # 即崩，但已在数据卷里留下了「有目录、缺 service.properties」的残缺库。
    # 数据卷是持久化的，restart 每次都撞在同一处，安装就此永久卡死；而报错只写
    # load derby-schema.sql error，完全看不出是残留数据的问题（`down` 也不清卷）。
    # 官方镜像没有自愈逻辑，这里在每次启动前拦一道：残缺就删掉重来。
    # 路径全写字面量、不用 shell 变量，避免 compose 对 $ 的转义歧义。
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -d /home/nacos/data/derby-data ] && [ ! -f /home/nacos/data/derby-data/service.properties ]; then
          echo "[houcloud] 检测到残缺的 Derby 数据目录（上次建库中断），清理后重建"
          rm -rf /home/nacos/data/derby-data
        fi
        exec /home/nacos/bin/docker-startup.sh
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_PASSWORD: ${NACOS_AUTH_PASSWORD:-nacos}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-change-me-generate-with-openssl-rand-base64-32}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-houcloud}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-houcloud}
      JVM_XMS: 512m
      JVM_XMX: 1024m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
      # gRPC 端口：客户端注册/配置长轮询要走 9848（宿主机上的 jar 也需要）
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_RAFT_PORT:-9849}:9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/ >/dev/null"]
      interval: 10s
      timeout: 5s
      # 实测慢盘/高负载下 nacos 从启动到可服务要 60-90s，start_period 给 40s 太紧，
      # 会把「还在初始化」误判成 unhealthy。放宽到 90s + 60 次重试（约 10 分钟容错）。
      retries: 60
      start_period: 90s
    restart: unless-stopped

  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.1.4}
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m
      TZ: Asia/Shanghai
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.1.4}
    # 镜像默认以 rocketmq(uid 3000) 运行，而挂载的命名卷是 root 属主，
    # 不切换成 root 会因 store 目录不可写导致 broker 启动失败（表现为 NPE 退出）。
    user: "0:0"
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-rocketmq-broker
    command: ["sh", "-c", "exec sh mqbroker -c /opt/rocketmq/conf/broker.conf"]
    environment:
      JAVA_OPT_EXT: -Xms512m -Xmx1024m -Xmn256m
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/rocketmq/broker.conf:/opt/rocketmq/conf/broker.conf:ro
      - rocketmq-data:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------ 配置初始化
  nacos-init:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nacos-init
    image: unimall/nacos-init:latest
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-nacos-init
    working_dir: /work
    volumes:
      # 挂载仓库配置目录：改完配置重新 `docker compose run --rm nacos-init` 即可，不用重建镜像。
      # 🔴 必须是 :ro —— 容器以 root 运行，可写挂载会让它把渲染产物（variables.env、
      # build/）写回宿主机源码树，属主变 root，之后普通用户 rm -rf / git clean 全被拒；
      # entrypoint 检测到只读会自动在容器内暂存渲染，功能不受影响。
      - ./deploy/scripts/nacos-templates:/work:ro
      # 🔴 2026-10-31：variables.env 持久化（site-code 等实例标识幂等的真源）。
      # /work 只读导致渲染产物留在容器内，容器销毁即丢 → 重跑 nacos-init 换新 site-code，
      # 平台侧把同一站点登记成多行。挂 named volume，down -v 时随之清（全新实例新码，符合设计）。
      - nacos-init-data:/persist
    environment:
      NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
      NACOS_USER: ${NACOS_USER:-nacos}
      # 与上面 x-java-service 的口令取值保持一致：NACOS_PASSWORD 优先
      NACOS_PASSWORD: ${NACOS_PASSWORD:-${NACOS_AUTH_PASSWORD:-nacos}}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-houeoc}
      NACOS_AUTH_ENABLED: ${NACOS_AUTH_ENABLE:-true}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ES_PASSWORD: ${ES_PASSWORD:-}
      WEB_PORT: ${WEB_PORT:-8080}
      # 🔴 2026-10-27：默认按模式 A 的服务名渲染（compose 已恢复 redis 服务）。
      # 模式 B（外部/宿主 Redis，host 网络）在 .env 里设 REDIS_ADDR=127.0.0.1:6379；
      # 跨机部署设成真实地址。地址错的表现是服务启动时 RedisConfig 报「缺少必要的 spring.redis.*配置」。
      RENDER_REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      RENDER_NACOS_SERVER_ADDR: nacos:8848
      RENDER_ROCKETMQ_NAMESERVER: rocketmq-namesrv:9876
      RENDER_BFF_ADDR: bff-web:8391
      RENDER_ES_ADDR: elasticsearch:9200
      RENDER_THIRD_ADDR: http://thirdparty:8194
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------ 微服务
  permission:
    <<: *java-service
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-permission
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-unimall/builder:latest}
        JAR_NAME: permission
    image: unimall/permission:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/8300' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 150s

  auth:
    <<: *java-service
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-auth
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-unimall/builder:latest}
        JAR_NAME: auth
    image: unimall/auth:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/8392' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 150s

  base:
    <<: *java-service
    container_name: ${COMPOSE_PROJECT_NAME:-unimall}-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-unimall/builder:latest}
        JAR_NAME: base
    image: unimall/base:${IMAGE_TAG:-latest}
    # 🔴 插件制品根（2026-10-27 补）：base 负责 /plugin-assets/** 产物托管和
    # 市场在线安装落盘，缺这个挂载时插件前端产物一律 404「插件产物不存在: index.mjs」，
    # 且市场安装的 jar 写在容器临时层，容器重建即丢。
    # 用宿主机目录（与模式 B 的 ${PLUGINS_DIR} 同一口径），换机/重建都不丢已装插件。
    volumes:
      - ${PLUGINS_DIR:-./plugins}:/app/plugins
      # 制品签名私钥（只读）。由 deploy/install.sh 首次安装时生成到宿主机 secrets/，
      # 权限 600。生产环境应改为在签名机上签名、只把公钥分发到本机 ——
      # 私钥留在应用服务器上等于把「以官方名义发布任意插件」的能力放进了容器。
      - ${PLUGIN_SIGN_SECRETS_DIR:-./secrets}:/app/secrets:ro
      # 上传的制品本体（local 存储模式）。ArtifactProperties.root 默认是
      # ${user.home}/houcloud/artifacts，在容器里等于 /root/houcloud/artifacts ——
      # 容器一重建，已发布/已上架的 jar 全丢，下载接口随即 404。必须落到宿主目录。
      - ${ARTIFACTS_DIR:-./artifacts}:/app/artifacts
    environment:
      <<: *java-service-env
      HOUCLOUD_ARTIFACT_ROOT: /app/artifacts

spring:
    redis:
     # Redis服务器地址（host:port 由渲染器从 REDIS_ADDR 拆分；host 字段不能带端口——
     # 塞复合值会让 Lettuce 把 "redis:6379" 当主机名解析，启动即 UnknownHostException）
      host: ${REDIS_HOST}
      # Redis服务器连接端?
      port: ${REDIS_PORT}
       # Redis服务器连接密?
      password: ${REDIS_PASSWORD}
      database: 14
      # 命令执行超时时间（毫秒），防止Redis连接断开时无限阻?
      timeout: 3000
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 10
          # 连接池最大阻塞等待时?
          max-wait: 3000ms
          # 连接池中的最大空闲连?
          max-idle: 10
          # 连接池中的最小空闲连?
          min-idle: 1
        # 关闭超时时间
        shutdown-timeout: 2000ms

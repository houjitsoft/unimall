management:
  endpoints:
    web:
      exposure:
        include: '*'
feign:
  sentinel:
    enabled: true
  # Docker bridge 网络模式下，服务间调用一律走 Nacos 服务发现：
  # 各服务源码里 @FeignClient(url="${feign.X.url:http://127.0.0.1:PORT}") 的直连默认值
  # 是 host 网络时代的产物，bridge 模式下 127.0.0.1 指向容器自身必拒连。
  # 此处统一置空（url 为空时 OpenFeign 按 name 走服务发现）；
  # 需要直连的部署形态由外部环境变量 FEIGN_*_URL 或更高优先级的配置覆盖。

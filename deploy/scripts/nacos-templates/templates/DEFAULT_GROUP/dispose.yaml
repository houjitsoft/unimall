# 项目部署域名
domainName: https://cloud.shangliansoft.cn
# 字体路径
fontUrlPath: /home/wwwroot/fontPath
spring: 
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 20MB  
system:
  pcIndexConfig: JAVA_PC_INDEX_CONFIG_TEST # pc首页配置redis key

firstLevel: https://b2c-test.unimall.cn # 小程序授权回调域名 
crtUploadPath: /home/wwwroot/cert # 品牌店铺支付证书路径

TRANS_APP_ID: 20211220001033278
TRANS_SECURITY_KEY: ${DISPOSE_SIGN_KEY}
TRANS_PC_i18nPath: /home/wwwroot/html
ES_WORDS_PATH: /home/wwwroot/html
paypal:
  client:
    mode: sandbox
    app: ${DISPOSE_PAYPAL_CLIENT_CREDENTIAL}
    secret: ${DISPOSE_PAYPAL_CLIENT_SECRET}
stripe:
  # 沙盒
  key: ${DISPOSE_STRIPE_CREDENTIAL}
  sectret: ${DISPOSE_STRIPE_CREDENTIAL_2}
  webhooksKey: ${DISPOSE_STRIPE_CREDENTIAL_3}
  merchantName: 上海unimall信息科技
  
#加解密证书
privateKeyPath: ${DISPOSE_PRIVATE_KEY}

aliyun: 
  accessKeyId: ${DISPOSE_ALIYUN_AK_ID}
  secret: ${DISPOSE_ALIYUN_SECRET}
  signName: unimall集团

shopAppId: ${DISPOSE_AK_ID}
shopAppIdSecret: ${DISPOSE_SECRET}  

#怡亚通 App Key
appKey: 111111111
#怡亚通 APP Secre
appSecret: ${DISPOSE_SECRET_2}
#怡亚通供应链API请求域名
sceUrl: https://sce-opz.changecloud.cn
#获取省市区地址
getRegionByCodeOpenPath: /scce/pbc/pbc/region/getRegionByCodeOpen
#获取分类信息
getCategorysPath: /scce/cmc/cmc/spu/open/getCategorys
#获取分类信息
getBrandsPath: /scce/cmc/cmc/spu/open/getBrands
#查询商品库SPUID列表
getSpuIdListPath: /scce/cmc/cmc/spu/open/getSpuIdList
#查询查询SPU商品详情
getSpuBySpuIdsPath: /scce/cmc/cmc/spu/open/getSpuBySpuIds
#查询SKU规格信息
listSkuBySpuIdPath: /scce/cmc/cmc/spu/open/listSkuBySpuId
#查询商品运费
calculatePath: /scce/cmc/cmc/freight/calculate
#查询商品价格
findSkuSalePricePath: /scce/cmc/cmc/spu/open/goods/findSkuSalePrice
#查询商品库存
findSkuStockPath: /scce/cmc/cmc/spu/open/findSkuStock
#修改订单收货地址
updateOrderReceiveAddressPath: /scce/ctc/ctc/reseller/order/updateOrderReceiveAddress

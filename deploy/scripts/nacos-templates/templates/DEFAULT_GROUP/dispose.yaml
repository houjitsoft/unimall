#创建订单
submitOrderPath: /scce/ctc/ctc/reseller/order/submitOrder
#根据外部订单号查询订单详情列表
getOrderDetailListPath: /scce/ctc/openApi/reseller/order/getOrderDetailList
#查询订单详情
getOrderDetailPath: /scce/ctc/ctc/reseller/order/getOrderDetail
#查询物流信息
getOrderExpressListByOsPath: /scce/ctc/ctc/tOrderExpress/getOrderExpressListByOs
#确认收货 
confirmReceivePath: /scce/ctc/ctc/reseller/order/confirmReceive
#售后申请
applyRefundPath: /scce/ctc/ctc/reseller/orderReturnGoods/applyRefund
#退货/换货邮寄卖家
sendReturnGoodsPath: /scce/ctc/ctc/reseller/orderReturnGoods/sendReturnGoods
#换货确认收货
receiptRefundPath: /scce/ctc/ctc/reseller/orderReturnGoods/receiptRefund
#取消售后申请
cancelRefundPath: /scce/ctc/ctc/reseller/orderReturnGoods/cancelRefund
#查询售后单详细信息
orderReturnGoodsDetailPath: /scce/ctc/ctc/reseller/orderReturnGoods/detail

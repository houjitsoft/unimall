# 数据存储方式，db代表数据库
store.mode=db
store.db.datasource=druid
store.db.dbType=mysql
store.db.driverClassName=com.mysql.cj.jdbc.Driver
store.db.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/seata${MYSQL_PARAMS}
 
store.db.user=seata
store.db.password=${SEATA_PASSWORD}
store.db.minConn=5
store.db.maxConn=30
store.db.globalTable=global_table
store.db.branchTable=branch_table
store.db.queryLimit=100
store.db.lockTable=lock_table
store.db.maxWait=5000
# 事务、日志等配置
server.recovery.committingRetryPeriod=3000
server.recovery.asynCommittingRetryPeriod=3000
server.recovery.rollbackingRetryPeriod=3000
server.recovery.timeoutRetryPeriod=3000
server.maxCommitRetryTimeout=-1
server.maxRollbackRetryTimeout=-1
server.rollbackRetryTimeoutUnlockEnable=false
server.undo.logSaveDays=7
server.undo.logDeletePeriod=86400000
 
# 客户端与服务端传输方式
transport.serialization=seata
transport.compressor=none

# 关闭metrics功能，提高性能
metrics.enabled=false
metrics.registryType=compact
metrics.exporterList=prometheus
metrics.exporterPrometheusPort=9898

# 注册中心配置
registry.type=nacos
registry.nacos.application=seata-server
registry.nacos.server-addr=${NACOS_SERVER_ADDR}
registry.nacos.group=SEATA_GROUP
registry.nacos.namespace=houeoc
registry.nacos.username=nacos
registry.nacos.password=${SEATA_PASSWORD_2}

# 配置中心配置
config.type=nacos
config.nacos.server-addr=${NACOS_SERVER_ADDR}
config.nacos.namespace=houeoc
config.nacos.group=SEATA_GROUP
config.nacos.username=nacos
config.nacos.password=${SEATA_PASSWORD_2}
config.nacos.data-id=seataServer.properties

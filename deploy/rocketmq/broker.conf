# RocketMQ Broker 配置（容器内）
# 说明：容器网络里必须显式声明 brokerIP1，否则 NameServer 回给客户端的是容器内网 IP，
#       跨容器访问会连不上。
brokerClusterName = HouCloudCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 与 docker-compose 中的服务名保持一致
brokerIP1 = rocketmq-broker
namesrvAddr = rocketmq-namesrv:9876

# 首次部署自动建 Topic，省去手工创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 容器内存有限，调小刷盘线程与队列
sendMessageThreadPoolNums = 8
listenPort = 10911

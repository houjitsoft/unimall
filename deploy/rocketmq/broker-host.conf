# RocketMQ Broker 配置（docker-compose.middleware.yml 专用：jar 跑在宿主机）
#
# 与全容器版 broker.conf 的唯一区别：brokerIP1 必须是宿主机能连到的地址。
# 因为消费端（jar）跑在宿主机上，NameServer 会把 brokerIP1 回给它，
# 写容器名（rocketmq-broker）宿主机解析不了，所以这里写 127.0.0.1 + 已映射的 10911 端口。
brokerClusterName = HouCloudCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

brokerIP1 = 127.0.0.1
namesrvAddr = rocketmq-namesrv:9876

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

sendMessageThreadPoolNums = 8
listenPort = 10911

# HouCloud 管理后台 Nginx 配置（容器内）
# 静态前端 + /web/ 反向代理到网关 bff-web:8391
upstream unimall_bff {
    server bff-web:8391;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端资源：短缓存，避免发版后浏览器还拿旧的 JS/CSS
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1h;
        try_files $uri =404;
    }

    # 🔴 插件前端产物【不要在这里静态拦截】。
    # 产物由 base 服务的 PluginAssetController 动态提供（BFF PluginProxyController 把
    # /web/plugin-assets/{code}/{version}/** 泛化转发到宿主 /plugin-assets/**，T11）。
    # 在线安装的插件产物落在 base 容器磁盘上，nginx 侧根本没有这份文件；这里若用 try_files
    # 抢先命中，在线安装的插件前端一律 404，后台每次开页面都刷
    # 「Failed to fetch dynamically imported module」（2026-10-28 开源评估线实锤）。
    # 因此不定义该 location，让它落到下面的 location /web/ 反向代理，交给后端解析。

    # SPA 路由回退
    location / {
        # index.html 不缓存：SPA 发版靠它引用新 hash 的 JS/CSS；被启发式缓存会卡住旧 JS。
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # 接口：前端 VITE_APP_BASE_API=/web
    location /web/ {
        proxy_pass http://unimall_bff/web/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 不带斜杠的 /web 也一并代理（部分接口直接以 /web 开头且无后续路径）
    location = /web {
        proxy_pass http://unimall_bff/web;
        proxy_set_header Host $host;
    }
}

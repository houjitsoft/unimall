# =====================================================================
# HouCloud 安装向导 · 安装期 Nginx（install-web 容器专用）
#
# 与正式 admin-web 的区别：
#   - root 直接指向仓库 public/（/install/ 下的静态 SPA 由 git 提供，无构建）。
#   - 域名根路径一律 302 进 /install/：这就是「首次访问自动跳转到安装界面」。
#   - /install/api/ 反代 install-agent（8370）：向导页的安装编排/进度/重置接口。
#
# 安装完成后 install-web 被 agent 停止，WEB_PORT 交还 admin-web，
# 「跳转」自然消失 —— 不需要运行时判断「是否已安装」。
# =====================================================================
upstream install_agent {
    server install-agent:8370;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;   # = 仓库 public/
    index index.html;

    # 机器探活/误输入域名根路径 → 进向导
    location = / {
        return 302 /install/;
    }
    location = /index.html {
        return 302 /install/;
    }

    # 向导 API：reset（down -v 最长十几分钟）与 finish 都可能慢
    location ^~ /install/api/ {
        proxy_pass http://install_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
    }

    # 向导静态页（SPA 路由回退到 /install/index.html；
    # ^~ 保证它优先于下面的静态资源正则）
    location ^~ /install/ {
        try_files $uri $uri/ /install/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    # 装完之前不给任何其他页面（防止误以为系统已可用）
    location / {
        return 302 /install/;
    }
}

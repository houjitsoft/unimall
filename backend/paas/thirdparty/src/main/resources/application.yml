# =====================================================================
# 【2026-10-28 迁移】Boot 3.5.16 + Spring Cloud 2025.0.3 下 legacy
# bootstrap.yml 不再生效（spring-cloud-starter-bootstrap 也救不回来：
# jar 里有该依赖但 bootstrap 上下文不会运行，Nacos 一条配置都拉不到，
# 表现为 DataSource/Redis 等配置缺失导致启动失败）。已改用 SB3 原生
# Config Data（spring.config.import），与 backend/paas/aiagent 的
# application.yml 同款改造。原 bootstrap.yml 已删除。
# =====================================================================
# nacos 配置
# 优先级 共享配置 < 扩展配置 < 服务名 < 服务名.文件扩展名 < 服务名-环境.文件扩展名
spring:
  application:
    name: thirdparty
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 10000
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      validation-timeout: 2000
      keepalive-time: 30000
  # SB3 Config Data：主 dataId + 原 extension-configs 全量平移
  config:
    import:
      - nacos:thirdparty.yaml
      - nacos:mutual.yaml
      - nacos:mybatis.yaml
      - nacos:redis.yaml
      - nacos:sentinel.yaml
      - nacos:seata.yaml
      - nacos:dispose.yaml
      - nacos:rocketmq.yaml
  cloud:
    config:
      enabled: false
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

# Feign：base 短信配置必须直连，避免 Nacos 名 base 解析失败拖垮发码
feign:
  base:
    url: ${FEIGN_BASE_URL:http://127.0.0.1:8214}
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
      base:
        connectTimeout: 2000
        readTimeout: 5000

# 默认配置
shopAppId: ${SHOP_APP_ID:}
shopAppIdSecret: ${SHOP_APP_ID_SECRET:}

# =====================================================================
# 【2026-10-28 迁移】Boot 3.5.16 + Spring Cloud 2025.0.3 下 legacy
# bootstrap.yml 不再生效（spring-cloud-starter-bootstrap 也救不回来：
# jar 里有该依赖但 bootstrap 上下文不会运行，Nacos 一条配置都拉不到，
# 表现为 DataSource/Redis 等配置缺失导致启动失败）。已改用 SB3 原生
# Config Data（spring.config.import），与 backend/paas/aiagent 的
# application.yml 同款改造。原 bootstrap.yml 已删除。
# =====================================================================
# naocs 配置
# 优先级 共享配置 < 扩展配置 < 服务名 < 服务名.文件扩展名 < 服务名-环境.文件扩展名
spring:
  servlet:
    multipart:
      max-file-size: ${UNIMALL_RELEASE_MAX_FILE_SIZE:8GB}
      max-request-size: ${UNIMALL_RELEASE_MAX_REQUEST_SIZE:16GB}
      file-size-threshold: 0
  profiles:
    active: with-mq
  application:
    name: base
  # SB3 Config Data：主 dataId + 原 extension-configs 全量平移
  config:
    import:
      - optional:classpath:application-plugin.yml
      - nacos:base.yaml
      - nacos:mutual.yaml
      - nacos:mybatis.yaml
      - nacos:redis.yaml
      - nacos:sentinel.yaml
      - nacos:seata.yaml
      - nacos:dispose.yaml
      - nacos:rocketmq.yaml
  cloud:
    config:
      enabled: false
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
  main:
    allow-bean-definition-overriding: true

# =====================================================================
# 【2026-10-28 迁移】Boot 3.5.16 + Spring Cloud 2025.0.3 下 legacy
# bootstrap.yml 不再生效（spring-cloud-starter-bootstrap 也救不回来：
# jar 里有该依赖但 bootstrap 上下文不会运行，Nacos 一条配置都拉不到，
# 表现为 DataSource/Redis 等配置缺失导致启动失败）。已改用 SB3 原生
# Config Data（spring.config.import），与 backend/paas/aiagent 的
# application.yml 同款改造。原 bootstrap.yml 已删除。
# =====================================================================
# nacos 配置
# 优先级 共享配置 < 扩展配置 < 服务名 < 服务名.文件扩展名 < 服务名-环境.文件扩展名
server:
  port: ${SERVER_PORT:8392}
spring:
  application:
    name: auth
  # Redis配置(实际使用Nacos配置,这里仅作傅底)
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:14}
  # SB3 Config Data：主 dataId + 原 extension-configs 全量平移
  config:
    import:
      - nacos:auth.yaml
      - nacos:mutual.yaml
      - nacos:redis.yaml
      - nacos:sentinel.yaml
      - nacos:seata.yaml
      - nacos:dispose.yaml
      - nacos:rocketmq.yaml
      - nacos:mybatis.yaml
  cloud:
    config:
      enabled: false
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 30000
          userms:  # 用户服务；直连见下方 feign.userms.url，避免 Nacos 幽灵实例
            connect-timeout: 3000
            read-timeout: 10000
          business:  # 业务服务
            connect-timeout: 5000
            read-timeout: 15000
          payment:  # 支付服务
            connect-timeout: 5000
            read-timeout: 10000
      # 熔断器：开启后 Feign 在独立线程执行，RequestContextHolder 丢失，导致 Authorization 无法传到下游服务
      # 与 bff-web 保持一致策略，关闭熔断器以保证 Token 透传
      circuitbreaker:
        enabled: false
  main:
    allow-bean-definition-overriding: true

# 同机部署直连 userms，与 bff-web 一致；跨机可用环境变量 FEIGN_USERMS_URL 覆盖
feign:
  userms:
    url: ${FEIGN_USERMS_URL:http://127.0.0.1:8195}

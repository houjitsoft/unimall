spring:
  application:
    # 🔴 必须是 ai，不能写 aiagent：BFF 的 AiServiceFeign 是 @FeignClient(name = "ai")，
    #    服务名一旦改掉，/web/ai/** 全部接口仍会找不到提供方。
    name: ai

  # 🔴🔴 2026-10-27 实测（重要，全平台通用）：
  # 平台升级到 Boot 3.5.16 + Spring Cloud 2025.0.3 后，**legacy bootstrap.yml 不再生效**。
  # 表现：Nacos 一条配置都拉不到，直接报
  #     Failed to configure a DataSource: 'url' attribute is not specified
  #     Reason: Failed to determine a suitable driver class
  # 极易误判成「数据源没配 / 没引 mysql 驱动」而往错误方向排查。
  # 取证方法：启动日志里搜 nacos，一行都搜不到即可确认 bootstrap 阶段没跑。
  # 解法：改用 Spring Boot 3 原生 Config Data —— spring.config.import。
  # 现网 20+ 服务目前不受影响，是因为它们跑的是升级前构建的旧镜像；
  # 一旦重建镜像就会踩同一个坑，必须按本文件方式改造。
  config:
    import:
      - nacos:ai.yaml
      # commons 中的支付、字体等共享组件依赖 domainName、fontUrlPath 等全局配置，
      # 定义在 dispose.yaml。独立服务必须自行加载，否则启动即抛
      # Could not resolve placeholder '${domainName}'。
      - nacos:dispose.yaml
      - nacos:mutual.yaml
      - nacos:mybatis.yaml
      - nacos:redis.yaml
      - nacos:seata.yaml

  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASSWORD:}

  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      # aiagent 只做单库读写，不参与跨服务全局事务。
      # Seata 2.5 客户端启动即要求 service.vgroupMapping，而线上 Seata server 仍是 1.8.1，
      # 不排除会直接启动失败（2026-10-27 实测）。等平台统一升 Seata 2.5 再评估是否启用。
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      # Spring AI 的自动配置只支持「一个应用一个静态模型」（spring.ai.openai.api-key +
      # base-url 写死在配置里），且未配 api-key 时 OpenAiAudioSpeechAutoConfiguration 等
      # 启动即抛 IllegalArgumentException，直接把服务拖挂。
      # aiagent 需要的是按 hou_ai_model 表在运行时动态构建 ChatModel（多模型 / 多网关档案），
      # 与该自动配置模型天然冲突，故整体关闭，改由 SpringAiModelClient 自行构建。
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

houcloud:
  product:
    code: aiagent
    package: com.houjiang.aiagent
  plugin:
    host-service: aiagent
    boot-enabled: false
    plugins-dir: ${PLUGIN_DIR:plugins/aiagent}

# =====================================================================
# 【2026-10-28 迁移】Boot 3.5.16 + Spring Cloud 2025.0.3 下 legacy
# bootstrap.yml 不再生效（spring-cloud-starter-bootstrap 也救不回来：
# jar 里有该依赖但 bootstrap 上下文不会运行，Nacos 一条配置都拉不到，
# 表现为 DataSource/Redis 等配置缺失导致启动失败）。已改用 SB3 原生
# Config Data（spring.config.import），与 backend/paas/aiagent 的
# application.yml 同款改造。原 bootstrap.yml 已删除。
# =====================================================================
# naocs 配置
# 优先级 共享配置 < 扩展配置 < 服务名 < 服务名.文件扩展名 < 服务名-环境.文件扩展名
spring:
  profiles:
    active: with-mq
  application:
    name: job
  # SB3 Config Data：主 dataId + 原 extension-configs 全量平移
  config:
    import:
      - nacos:job.yaml
      - nacos:mutual.yaml
      - nacos:mybatis.yaml
      - nacos:redis.yaml
      - nacos:sentinel.yaml
      - nacos:seata.yaml
      - nacos:rocketmq.yaml
      - nacos:dispose.yaml
  cloud:
    config:
      enabled: false
    nacos:
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:houeoc}
        username: nacos
        password: ${NACOS_PASSWORD:}
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
  main:
    allow-bean-definition-overriding: true

# 插件内部定时任务令牌：job 调用 OA/GEO 归属服务 /plugin/{code}/job/** 时随 X-Internal-Job-Token
# 头发送，须与对应服务的 houcloud.plugin.internal-job-token 保持一致。生产真实值由 Nacos
# job.yaml 提供（默认留空，未配置时该链路会因缺凭据失败，不会静默放行）。禁止提交真实值。
houcloud:
  plugin:
    internal-job-token: ${HOU_INTERNAL_JOB_TOKEN:}

# xxl-job 分布式任务调度配置
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:38082/xxl-job-admin
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: houcloud
      address:
      ip:
      port: 19990
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

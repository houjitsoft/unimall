# Installation readiness checks both local dependencies before activation.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis

# Initialize only the service-owned baseline; no cross-service tables.
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/logging.sql
      encoding: UTF-8
      continue-on-error: false
